<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07060a" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <main class="calculator">
        <h1>Simple Calculator</h1>
        <form method="post" action="/">
            <label>
                First number
                <input type="number" step="any" name="a" value="{{ a }}" required />
            </label>

            <label>
                Second number <span class="hint">— not used by n!</span>
                <input type="number" step="any" name="b" value="{{ b }}" />
            </label>

            <div class="ops">
                <button type="submit" name="op" value="add" title="Add">+</button>
                <button type="submit" name="op" value="sub" title="Subtract">−</button>
                <button type="submit" name="op" value="mul" title="Multiply">×</button>
                <button type="submit" name="op" value="div" title="Divide">÷</button>
                <button type="submit" name="op" value="fact" class="op-extra"
                        title="Factorial of the first number">n!</button>
                <button type="submit" name="op" value="pct" class="op-extra"
                        title="Percentage: the first number percent of the second (a% of b)">%</button>
            </div>

            <p class="hint hint-legend">
                <strong>n!</strong> factorial of the first number
                &nbsp;·&nbsp;
                <strong>%</strong> a% of b
            </p>
        </form>

        {% if result is not none %}
            <div class="result">Result: <strong>{{ result }}</strong></div>
        {% endif %}
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </main>
</body>
</html>
